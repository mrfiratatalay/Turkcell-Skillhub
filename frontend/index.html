<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1222" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Mirrors MODE_STORAGE_KEY and COLOR_SCHEME_ATTRIBUTE in src/app/theme/schemes.ts (dark is the default).
      (function () {
        try {
          var mode = localStorage.getItem('skillhub.theme') || 'dark';
          if (mode === 'system') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
          if (mode === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3F5F9');
        } catch (error) {}
      })();
    </script>
    <meta
      name="description"
      content="SkillHub: Her ders bir yıldız. Turkcell Code Night 2025 Trabzon birincisi, gece temalı oyunlaştırılmış dijital beceri platformu."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Canvas color until the app styles load (values from src/app/theme/schemes.ts). */
      html { background: #0d1222; }
      html[data-theme='light'] { background: #f3f5f9; }
    </style>
    <title>SkillHub · Gece Boyu Öğren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
