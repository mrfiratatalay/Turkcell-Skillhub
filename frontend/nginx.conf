# SkillHub web: serves the single-page app and proxies the API on the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Inherited by every proxied location. $http_host keeps the public port (e.g. localhost:3000),
    # so Spring's redirects (Swagger UI) point back to this proxy, not to the container.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s; # the AI guide may think for up to a minute

    # REST API, Swagger UI and the OpenAPI document all live on the Spring Boot service.
    location /api/ {
        proxy_pass http://api:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://api:8080;
    }

    location /v3/api-docs {
        proxy_pass http://api:8080;
    }

    # Fingerprinted build output never changes, so browsers may keep it for good.
    location /assets/ {
        expires max;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/gokyuzu, /dersler/...) all load the app shell, which is always revalidated.
    location / {
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
