spring:
  application:
    name: skillhub-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/skillhub
    username: postgres
    password: firat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /api

# CSV Seed Data Configuration
app:
  csv:
    base-path: classpath:turkcell_skillhub_seed_data/
    files:
      users: users.csv
      categories: categories.csv
      lessons: lessons.csv
      quizzes: quizzes.csv
      quiz-results: quiz_results.csv
      badges: badges.csv
      leaderboard: leaderboard.csv

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-rendering: model

